# PR과 main 푸시마다 컴파일과 JUnit 테스트를 자동으로 실행
name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 컴파일과 테스트 (mvn test)
        run: mvn -B test
